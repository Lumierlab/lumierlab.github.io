<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b14">
  <meta name="description" content="LumiereLab – Homelab, Technik, 3D-Druck und kreative Ideen.">
  <title>LumiereLab</title>
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">

  <style>
    :root {
      --bg: #070b14;
      --text: #f7f9fc;
      --muted: #9aa7bd;
      --line: rgba(255, 255, 255, .09);
      --accent: #7dd3fc;
      --accent-2: #a78bfa;
      --max: 1120px;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 20% -10%, rgba(125, 211, 252, .16), transparent 30%),
        radial-gradient(circle at 90% 10%, rgba(167, 139, 250, .13), transparent 28%),
        var(--bg);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }

    .wrap {
      width: min(calc(100% - 40px), var(--max));
      margin: 0 auto;
    }

    header {
      height: 72px;
      position: relative;
      z-index: 10;
      border-bottom: 1px solid transparent;
      background: rgba(7, 11, 20, .72);
      backdrop-filter: blur(18px);
    }

    nav {
      height: 72px;
      display: flex;
      align-items: center;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-weight: 760;
      letter-spacing: -.03em;
      font-size: 1.08rem;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      position: relative;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 34px rgba(125, 211, 252, .18);
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 7px;
      background: var(--bg);
    }

    main {
      min-height: calc(100vh - 72px);
      display: grid;
      place-items: center;
    }

    .hero {
      width: 100%;
      padding: 60px 0 90px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(320px, .7fr);
      align-items: center;
      gap: 80px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--accent);
      font-weight: 650;
      font-size: .86rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 18px rgba(125, 211, 252, .75);
    }

    h1 {
      margin: 18px 0 22px;
      max-width: 820px;
      font-size: clamp(4rem, 9vw, 7.8rem);
      line-height: .92;
      letter-spacing: -.075em;
      font-weight: 820;
    }

    .gradient-text {
      background: linear-gradient(100deg, #fff 10%, #bfe8ff 52%, #c8b6ff 92%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero-copy {
      max-width: 680px;
      margin: 0;
      color: var(--muted);
      font-size: clamp(1.08rem, 2vw, 1.28rem);
    }

    .orbital {
      width: min(360px, 100%);
      aspect-ratio: 1;
      margin-inline: auto;
      position: relative;
      display: grid;
      place-items: center;
    }

    .orbital::before,
    .orbital::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 50%;
    }

    .orbital::after { inset: 14%; }

    .orbital-core {
      width: 42%;
      aspect-ratio: 1;
      border-radius: 28%;
      transform: rotate(45deg);
      background: linear-gradient(135deg, rgba(125,211,252,.95), rgba(167,139,250,.9));
      box-shadow:
        0 0 80px rgba(125,211,252,.22),
        0 0 120px rgba(167,139,250,.14);
      position: relative;
    }

    .orbital-core::after {
      content: "";
      position: absolute;
      inset: 18%;
      border-radius: 23%;
      background: var(--bg);
    }

    .dot {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 24px rgba(255,255,255,.7);
    }

    .dot.one { top: 7%; left: 46%; }
    .dot.two { right: 5%; bottom: 32%; width: 8px; height: 8px; background: var(--accent); }
    .dot.three { left: 13%; bottom: 18%; width: 9px; height: 9px; background: var(--accent-2); }

    @media (max-width: 900px) {
      main { min-height: auto; }

      .hero {
        padding: 76px 0 90px;
      }

      .hero-grid {
        grid-template-columns: 1fr;
        gap: 56px;
      }

      .orbital { width: 280px; }
    }

    @media (max-width: 620px) {
      .wrap { width: min(calc(100% - 28px), var(--max)); }

      .hero { padding: 64px 0 76px; }

      h1 { font-size: clamp(3.6rem, 18vw, 5.5rem); }

      .hero-grid { gap: 48px; }

      .orbital { width: min(250px, 78vw); }
    }
  </style>
</head>

<body>
  <header>
    <div class="wrap">
      <nav aria-label="Hauptnavigation">
        <a class="brand" href="/" aria-label="LumiereLab Startseite">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>LumiereLab</span>
        </a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="wrap hero-grid">
        <div>
          <div class="eyebrow">Build · Learn · Create</div>
          <h1 id="hero-title" class="gradient-text">LumiereLab</h1>
          <p class="hero-copy">
            Hallo :D
          </p>
        </div>

        <div class="orbital" aria-hidden="true">
          <div class="orbital-core"></div>
          <span class="dot one"></span>
          <span class="dot two"></span>
          <span class="dot three"></span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
